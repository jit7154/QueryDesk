services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: querydesk_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: querydesk_user
      POSTGRES_PASSWORD: querydesk_password
      POSTGRES_DB: querydesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querydesk_user -d querydesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
