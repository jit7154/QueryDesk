[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "querydesk-backend"
version = "0.1.0"
description = "QueryDesk backend API and AI agent orchestration"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "psycopg[binary,pool]>=3.1.18",
    "pgvector>=0.2.5",
    "google-genai>=0.1.0",
    "google-adk>=2.14.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "sqlglot>=23.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests as requiring a real database (deselect with '-m \"not integration\"')",
]
